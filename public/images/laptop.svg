<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="displayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#bgGrad)"/>

  <!-- Laptop Body Shadow -->
  <ellipse cx="200" cy="246" rx="130" ry="12" fill="#000" opacity="0.12"/>

  <!-- Laptop Screen Lid -->
  <g filter="url(#dropShadow)">
    <rect x="90" y="55" width="220" height="145" rx="10" fill="url(#screenGrad)"/>
    <rect x="98" y="63" width="204" height="125" rx="6" fill="url(#displayGrad)"/>
    
    <!-- Code / Interface Mock on Screen -->
    <rect x="110" y="75" width="60" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="110" y="90" width="120" height="6" rx="3" fill="#93c5fd" opacity="0.8"/>
    <rect x="110" y="102" width="150" height="6" rx="3" fill="#bfdbfe" opacity="0.7"/>
    <rect x="110" y="114" width="90" height="6" rx="3" fill="#93c5fd" opacity="0.8"/>
    <rect x="110" y="126" width="140" height="6" rx="3" fill="#60a5fa" opacity="0.8"/>

    <!-- Screen chart graphic -->
    <circle cx="250" cy="115" r="22" fill="#ffffff" opacity="0.15"/>
    <path d="M 235 125 L 245 110 L 255 118 L 265 102" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linecap="round"/>

    <!-- Webcam -->
    <circle cx="200" cy="59" r="2.5" fill="#64748b"/>
  </g>

  <!-- Laptop Base -->
  <path d="M 60 200 L 340 200 L 315 238 C 313 242 308 244 303 244 L 97 244 C 92 244 87 242 85 238 Z" fill="url(#baseGrad)"/>
  
  <!-- Notch -->
  <rect x="175" y="200" width="50" height="5" rx="2.5" fill="#64748b"/>

  <!-- Trackpad -->
  <rect x="170" y="210" width="60" height="26" rx="4" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
</svg>
