<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="chairBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="cushionGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="chairShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#chairBgGrad)"/>

  <!-- Shadow on floor -->
  <ellipse cx="200" cy="275" rx="75" ry="10" fill="#000" opacity="0.14"/>

  <g filter="url(#chairShadow)">
    <!-- Backrest Frame & Mesh -->
    <rect x="155" y="35" width="90" height="110" rx="18" fill="url(#cushionGrad)"/>
    <!-- Mesh Texture/Detail -->
    <rect x="165" y="45" width="70" height="90" rx="12" fill="#0f172a" opacity="0.6"/>
    <!-- Lumbar Support -->
    <rect x="160" y="105" width="80" height="20" rx="8" fill="#475569" opacity="0.75"/>

    <!-- Headrest -->
    <rect x="170" y="20" width="60" height="16" rx="8" fill="#1e293b"/>

    <!-- Armrests -->
    <path d="M 130 115 L 150 115 L 150 145" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <rect x="122" y="110" width="32" height="10" rx="5" fill="#334155"/>

    <path d="M 270 115 L 250 115 L 250 145" fill="none" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
    <rect x="246" y="110" width="32" height="10" rx="5" fill="#334155"/>

    <!-- Seat Cushion -->
    <rect x="140" y="150" width="120" height="32" rx="12" fill="url(#cushionGrad)"/>

    <!-- Central Gas Lift Cylinder -->
    <rect x="194" y="182" width="12" height="50" rx="2" fill="url(#metalGrad)"/>

    <!-- 5-Star Wheel Base -->
    <path d="M 200 230 L 140 260" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 200 230 L 260 260" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 200 230 L 165 268" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 200 230 L 235 268" stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="200" cy="230" r="10" fill="#334155"/>

    <!-- Casters (Wheels) -->
    <circle cx="138" cy="264" r="7" fill="#1e293b"/>
    <circle cx="262" cy="264" r="7" fill="#1e293b"/>
    <circle cx="163" cy="272" r="7" fill="#1e293b"/>
    <circle cx="237" cy="272" r="7" fill="#1e293b"/>
  </g>
</svg>
