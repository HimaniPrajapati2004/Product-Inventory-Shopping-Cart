<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="nbBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="nbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#78350f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="url(#nbBgGrad)"/>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="255" rx="95" ry="12" fill="#000" opacity="0.12"/>

  <g filter="url(#nbShadow)">
    <!-- Back Cover Extension / Edge -->
    <rect x="125" y="48" width="150" height="194" rx="8" fill="#b45309"/>

    <!-- Pages Block -->
    <rect x="122" y="44" width="148" height="194" rx="6" fill="url(#pageGrad)" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Front Cover -->
    <rect x="115" y="40" width="150" height="194" rx="8" fill="url(#coverGrad)"/>

    <!-- Inner Spine Border Accent -->
    <rect x="115" y="40" width="22" height="194" rx="4" fill="#b45309" opacity="0.5"/>

    <!-- Notebook Label Badge -->
    <rect x="148" y="70" width="84" height="42" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="2"/>
    <line x1="158" y1="84" x2="222" y2="84" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="158" y1="96" x2="204" y2="96" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>

    <!-- Bookmark Ribbon -->
    <path d="M 230 40 L 230 140 L 238 132 L 246 140 L 246 40 Z" fill="#ef4444"/>

    <!-- Spiral Rings -->
    <!-- Ring 1 -->
    <rect x="108" y="55" width="16" height="6" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Ring 2 -->
    <rect x="108" y="75" width="16" height="6" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Ring 3 -->
    <rect x="108" y="95" width="16" height="6" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Ring 4 -->
    <rect x="108" y="115" width="16" height="6" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Ring 5 -->
    <rect x="108" y="135" width="16" height="6" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Ring 6 -->
    <rect x="108" y="155" width="16" height="6" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Ring 7 -->
    <rect x="108" y="175" width="16" height="6" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Ring 8 -->
    <rect x="108" y="195" width="16" height="6" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
    <!-- Ring 9 -->
    <rect x="108" y="215" width="16" height="6" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>

    <!-- Elastic Band Holder -->
    <rect x="250" y="40" width="8" height="194" rx="2" fill="#78350f" opacity="0.4"/>

    <!-- Pen placed beside notebook -->
    <g transform="translate(262, 50) rotate(12)">
      <!-- Pen body -->
      <rect x="0" y="20" width="10" height="120" rx="4" fill="url(#penGrad)"/>
      <!-- Pen tip cone -->
      <polygon points="0,140 10,140 5,156" fill="#94a3b8"/>
      <polygon points="3,150 7,150 5,156" fill="#1e293b"/>
      <!-- Pen cap/clip -->
      <rect x="-1" y="20" width="12" height="35" rx="3" fill="#1e3a8a"/>
      <rect x="10" y="26" width="3" height="26" rx="1.5" fill="#94a3b8"/>
    </g>
  </g>
</svg>
